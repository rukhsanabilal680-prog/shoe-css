<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"></script>
</head>
<body>
    
<div class="card">

<div class="shoe-section">

      <div class="orange-circle"></div>

         <img class="image" src="./images/shoe.png" alt="shoe">

    <div class="arrows">
        <i class="fa-solid arrow1 fa-arrow-left-long"></i>
        &nbsp;
        <i class="fa-solid arrow2 fa-arrow-right-long"></i>
    </div>

</div>

        <div class="details">

            <h2>Airmax</h2>

            <div class="icons">
                <i class="fa-solid fa-magnifying-glass space icon"></i>
                <i class="fa-solid fa-user space icon"></i>
                <i class="fa-solid fa-cart-shopping space icon"></i>
            </div>

               <p class="collection">Winter Collection</p>

            <h1>Men Orange Sneakers</h1>

            <div class="price">
                <span>$150</span>
                <del>$200</del>

                <br>

                 <p class="label">SIZE</p>

            <div class="sizes">
                <span class="num">7</span>
                <span class="num">8</span>
                <span class="num">9</span>
                <span class="num">10</span>
                <span class="num">11</span>
            </div>

            <br>

             <p class="label">COLOR</p>

            <div class="colors">
                <span class="yellow"></span>
                <span class="black"></span>
                <span class="blue"></span>
            </div>

               <div class="icons">
                 <i class="fa-solid fa-cart-shopping icon"></i>Add To Cart
                 <i class="fa-solid fa-bag-shopping icon"></i>Buy Now 
                </div>
              

        </div>

    </div>

</body>
</html>
